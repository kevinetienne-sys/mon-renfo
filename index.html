<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mon Renfo</title>
<meta name="theme-color" content="#1A5FD6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Mon Renfo">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Carnet d'entraînement : une colonne mobile, cartes d'exercice avec 3 cases de série, minuteur en bas d'écran */
:root{
  --bg:#EEF2F5; --surface:#FFFFFF; --ink:#13202B; --muted:#5B6B78; --line:#D5DDE4;
  --accent:#1A5FD6; --accent-soft:#DCE7FB; --ok:#1E8A5A; --ok-soft:#DDF2E7; --warn:#B76A00; --danger:#C2362B; --danger-soft:#FBE3E0;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E151C; --surface:#17212B; --ink:#E6EDF3; --muted:#93A3B1; --line:#2A3743;
  --accent:#6C9BFF; --accent-soft:#1D2D4A; --ok:#4CC58C; --ok-soft:#173326; --warn:#E3A24A; --danger:#F07267; --danger-soft:#3A1E1C; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E151C; --surface:#17212B; --ink:#E6EDF3; --muted:#93A3B1; --line:#2A3743;
  --accent:#6C9BFF; --accent-soft:#1D2D4A; --ok:#4CC58C; --ok-soft:#173326; --warn:#E3A24A; --danger:#F07267; --danger-soft:#3A1E1C; color-scheme:dark}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--body);font-size:16px;line-height:1.45}
.wrap{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:calc(18px + env(safe-area-inset-top,0px)) 120px;display:flex;flex-direction:column;gap:18px}
header{display:flex;flex-direction:column;gap:12px}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
h1{font-family:var(--display);font-weight:800;font-size:2.4rem;line-height:1;margin:0;letter-spacing:.01em;text-transform:uppercase}
.date{color:var(--muted);font-size:.95rem}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column}
.stat b{font-family:var(--display);font-size:1.7rem;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.stat span{font-size:.78rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
nav{display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:4px;gap:4px}
nav button{font:600 .95rem var(--body);background:none;border:0;color:var(--muted);padding:9px 4px;border-radius:7px;cursor:pointer}
nav button[aria-selected="true"]{background:var(--accent);color:#fff}
button:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.list{display:flex;flex-direction:column;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px}
.card.done{border-color:var(--ok)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.name{font-family:var(--display);font-weight:700;font-size:1.45rem;line-height:1.1;text-transform:uppercase;letter-spacing:.02em}
.chip{font-size:.78rem;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.target{font-family:var(--display);font-size:2rem;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.target small{font-family:var(--body);font-size:.9rem;font-weight:500;color:var(--muted);margin-left:6px}
.sets{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.set{font:600 .95rem var(--body);border:1.5px solid var(--line);background:var(--bg);color:var(--ink);border-radius:9px;padding:11px 4px;cursor:pointer}
.set[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:#fff}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{font:600 .9rem var(--body);border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:8px 12px;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.big{width:100%;padding:14px;font-size:1.05rem}
details{border-top:1px solid var(--line);padding-top:8px}
summary{cursor:pointer;color:var(--accent);font-weight:600;font-size:.92rem}
details ul{margin:8px 0 0;padding-left:18px;color:var(--ink);font-size:.93rem;display:flex;flex-direction:column;gap:4px}
.banner{background:var(--ok-soft);border:1px solid var(--ok);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.banner p{margin:0}
.note{color:var(--muted);font-size:.88rem;margin:0}
table{width:100%;border-collapse:collapse;font-size:.92rem;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--line)}
th{font-size:.75rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600}
td.cur{background:var(--accent-soft);color:var(--accent);font-weight:600;border-radius:6px}
.scroll{overflow-x:auto}
.levelpick{display:flex;gap:6px;flex-wrap:wrap}
.levelpick button{font:600 .85rem var(--body);border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:7px;padding:6px 10px;cursor:pointer}
.levelpick button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.hist{display:flex;flex-direction:column;gap:6px}
.hist .row{font-size:.92rem}
.dots{display:flex;gap:4px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--line)}
.dot.on{background:var(--ok)}
.timer{position:fixed;left:0;right:0;bottom:0;background:var(--ink);color:var(--bg);padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;justify-content:space-between;gap:12px;z-index:5}
.timer .t{font-family:var(--display);font-size:2.6rem;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.timer .l{font-size:.85rem;opacity:.8}
.timer .btn{background:transparent;color:var(--bg);border-color:currentColor}
.saved{color:var(--ok);font-weight:600;text-align:center;margin:0}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field span{font-size:.8rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.field input,.field select,.field textarea,.edrow select{font:500 1rem var(--body);color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:8px;padding:10px;width:100%;min-width:0}
.field textarea{resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus,.edrow select:focus{outline:none;border-color:var(--accent)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grid3 .field span{font-size:.72rem}
.card.form{border-color:var(--accent)}
.edrow{display:flex;flex-direction:column;gap:8px;padding-block:10px;border-top:1px solid var(--line)}
.edrow .row{flex-wrap:nowrap}
.edrow strong{min-width:0}
.edrow select{width:auto;max-width:60%;padding:7px 8px;font-size:.88rem}
.set.small{padding:8px 4px}
.sets{grid-template-columns:repeat(auto-fit,minmax(70px,1fr))}
.err{color:var(--danger);font-weight:600;margin:0}
.btn.danger{background:var(--danger);border-color:var(--danger);color:#fff}
.btn.danger-outline{color:var(--danger);border-color:var(--danger)}
.confirm{background:var(--danger-soft);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.confirm p{margin:0}
tr.click{cursor:pointer}
tr.click:hover td,tr.click:focus td{background:var(--accent-soft)}
tr.click:focus{outline:none}
.lv{color:var(--muted)}
@media (max-width:380px){.grid3{grid-template-columns:1fr 1fr 1fr;gap:6px}}
@media (prefers-reduced-motion:no-preference){.set,nav button{transition:background .15s,color .15s}}
</style>
<style>[hidden]{display:none!important}*{box-sizing:border-box}body{margin:0;-webkit-tap-highlight-color:transparent}</style>
</head>
<body>


<div class="wrap">
  <header>
    <div class="top">
      <h1>Mon Renfo</h1>
      <div class="date" id="today"></div>
    </div>
    <div class="stats">
      <div class="stat"><b id="stStreak">0</b><span>Jours d'affilée</span></div>
      <div class="stat"><b id="stWeek">0</b><span>Cette semaine</span></div>
      <div class="stat"><b id="stTotal">0</b><span>Séances</span></div>
    </div>
    <nav role="tablist">
      <button role="tab" id="tab-jour" aria-selected="true" data-tab="jour">Aujourd'hui</button>
      <button role="tab" id="tab-prog" aria-selected="false" data-tab="prog">Programme</button>
      <button role="tab" id="tab-hist" aria-selected="false" data-tab="hist">Historique</button>
    </nav>
  </header>

  <section id="v-jour" class="list"></section>
  <section id="v-prog" class="list" hidden></section>
  <section id="v-hist" class="list" hidden></section>
  <p class="note" id="storeNote"></p>
  <input type="file" id="importFile" accept="application/json,.json" hidden>
</div>

<div class="timer" id="timer" hidden>
  <div><div class="l" id="timerLabel">Repos</div><div class="t" id="timerTime">0:60</div></div>
  <div class="actions"><button class="btn" id="timerAdd">+15 s</button><button class="btn" id="timerStop">Arrêter</button></div>
</div>

<script>
const BUILTIN = [
  {id:"pompes", name:"Pompes", unit:"reps", sets:3, rest:60, levels:[
    {t:"3 × 8", n:"sur les genoux"},{t:"3 × 12", n:"sur les genoux"},{t:"3 × 20", n:"sur les genoux"},
    {t:"3 × 8", n:"classiques"},{t:"3 × 12", n:"classiques"},{t:"3 × 20", n:"classiques"}],
   how:["Mains un peu plus larges que les épaules, corps gainé de la tête aux genoux (ou aux pieds).","Descends la poitrine près du sol en gardant les coudes à environ 45° du corps.","Souffle en poussant. Ne laisse pas le bassin s'affaisser."]},
  {id:"squats", name:"Squats", unit:"reps", sets:3, rest:60, levels:[{t:"3 × 15"},{t:"3 × 25"},{t:"3 × 35"}],
   how:["Pieds largeur d'épaules, pointes légèrement ouvertes.","Envoie les fesses en arrière, dos droit, genoux dans l'axe des pieds.","Descends jusqu'à cuisses parallèles au sol, remonte en soufflant."]},
  {id:"superman", name:"Superman", unit:"reps", sets:3, rest:45, levels:[{t:"3 × 8"},{t:"3 × 12"},{t:"3 × 15"}],
   how:["À plat ventre, bras tendus devant, jambes tendues, regard vers le sol.","Décolle bras, poitrine et jambes de 5 à 10 cm seulement, en même temps.","Tiens 2 s en t'allongeant, redescends en 2 s. Souffle en montant.","Trop dur : bras droit + jambe gauche, puis l'inverse. Douleur vive au dos : stop."]},
  {id:"curl", name:"Curl isométrique", unit:"sec", sets:3, rest:45, perSide:"par bras", levels:[{t:"3 × 15 s",s:15},{t:"3 × 25 s",s:25},{t:"3 × 40 s",s:40}],
   how:["Bras plié à 90°, paume vers le haut, coude collé au corps.","L'autre main sur le poignet : le bras pousse vers le haut, la main résiste. Rien ne bouge.","Pousse à 70-80 % de ta force en respirant normalement, puis change de bras.","Bras droit puis gauche = 1 série."]},
  {id:"planche", name:"Planche", unit:"sec", sets:3, rest:40, levels:[{t:"3 × 20 s",s:20},{t:"3 × 40 s",s:40},{t:"3 × 60 s",s:60}],
   how:["Sur les avant-bras, coudes sous les épaules.","Corps aligné, ventre et fessiers serrés, bassin ni trop haut ni trop bas.","Respire calmement, ne bloque pas ta respiration."]},
  {id:"lateral", name:"Gainage latéral", unit:"sec", sets:3, rest:40, perSide:"par côté", levels:[{t:"3 × 15 s",s:15},{t:"3 × 30 s",s:30},{t:"3 × 45 s",s:45}],
   how:["Sur un avant-bras, coude sous l'épaule, pieds empilés (ou genoux au sol pour faciliter).","Hanches hautes, corps en ligne droite.","Côté droit puis côté gauche = 1 série."]}
];

const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2,"0");
const dayKey = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const TODAY = dayKey(new Date());
const fmtDate = d => new Date(d+"T12:00:00").toLocaleDateString("fr-FR",{weekday:"short", day:"numeric", month:"short"});
const fmtLong = d => new Date(d+"T12:00:00").toLocaleDateString("fr-FR",{weekday:"long", day:"numeric", month:"long", year:"numeric"});

let state = { levels:{}, sessions:[], custom:[] };
let draft = {};
let justSaved = false;
let editing = null;      // séance en cours de saisie manuelle
let delConfirm = false;
let exForm = null;       // exercice en cours de création / modification
let exDelConfirm = null;

function ls(k, v){ try{ if(v===undefined){ const r=localStorage.getItem(k); return r?JSON.parse(r):null } localStorage.setItem(k, JSON.stringify(v)) }catch(e){ return null } }
function persist(){ ls("renfo-levels", state.levels); ls("renfo-sessions", state.sessions); ls("renfo-custom", state.custom) }

/* ---------- Exercices ---------- */
function customToEx(c){
  const suf = c.unit==="sec" ? " s" : "";
  return {id:c.id, name:c.name, unit:c.unit, sets:c.sets, rest:c.rest, perSide:c.perSide||"", custom:true,
    levels:c.targets.map(v=>({t:c.sets+" × "+v+suf, s:c.unit==="sec"?v:undefined})), how:c.how||[]};
}
function allEx(){ return BUILTIN.concat(state.custom.map(customToEx)) }
function exById(id){ return allEx().find(e=>e.id===id) }
function lvlOf(e){ const l = state.levels[e.id] || 1; return Math.min(l, e.levels.length) }
function emptySets(e){ return Array(e.sets).fill(false) }

/* ---------- Chargement ---------- */
function loadState(){
  const lv = ls("renfo-levels"); if(lv) state.levels = lv;
  state.sessions = ls("renfo-sessions") || [];
  state.custom = ls("renfo-custom") || [];
}
function loadDraft(){
  const d = ls("renfo-draft");
  draft = (d && d.day===TODAY) ? d.sets : {};
  if(!d || d.day!==TODAY){
    const s = state.sessions.find(x=>x.date===TODAY);
    if(s) for(const id in s.results) draft[id] = s.results[id].sets.slice();
  }
  allEx().forEach(e=>{ if(!draft[e.id] || draft[e.id].length!==e.sets) draft[e.id] = emptySets(e) });
}
function saveDraft(){ ls("renfo-draft", {day:TODAY, sets:draft}) }

function putSession(s){
  state.sessions = state.sessions.filter(x=>x.date!==s.date).concat(s);
  persist();
  if(s.date===TODAY){ for(const id in s.results) draft[id]=s.results[id].sets.slice(); saveDraft() }
}
function removeSession(date){
  state.sessions = state.sessions.filter(x=>x.date!==date); persist();
  if(date===TODAY){ ls("renfo-draft", null); draft={}; loadDraft() }
}

/* ---------- Calculs ---------- */
function sortedSessions(){ return state.sessions.slice().sort((a,b)=> a.date<b.date?1:-1) }
function streak(){
  const days = new Set(state.sessions.map(s=>s.date));
  const d = new Date(); if(!days.has(dayKey(d))) d.setDate(d.getDate()-1);
  let n=0; while(days.has(dayKey(d))){ n++; d.setDate(d.getDate()-1) }
  return n;
}
function thisWeek(){
  const d = new Date(); const dow = (d.getDay()+6)%7; d.setDate(d.getDate()-dow);
  const start = dayKey(d); return state.sessions.filter(s=>s.date>=start && s.date<=TODAY).length;
}
function readyToLevelUp(e){
  const lvl = lvlOf(e); if(lvl >= e.levels.length) return false;
  const last = sortedSessions().filter(s=>s.results && s.results[e.id]).slice(0,2);
  return last.length===2 && last.every(s => s.results[e.id].level===lvl && s.results[e.id].sets.length && s.results[e.id].sets.every(Boolean));
}

/* ---------- Minuteur ---------- */
let tEnd=0, tInt=null, actx=null;
function beep(){ try{ actx = actx || new (window.AudioContext||window.webkitAudioContext)();
  [0,0.25,0.5].forEach(o=>{ const os=actx.createOscillator(), g=actx.createGain(); os.frequency.value=880; os.connect(g); g.connect(actx.destination);
    g.gain.setValueAtTime(0.2, actx.currentTime+o); g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime+o+0.2); os.start(actx.currentTime+o); os.stop(actx.currentTime+o+0.2) }) }catch(e){} }
function startTimer(sec, label){
  try{ actx = actx || new (window.AudioContext||window.webkitAudioContext)(); actx.resume && actx.resume() }catch(e){}
  tEnd = Date.now()+sec*1000; $("timerLabel").textContent=label; $("timer").hidden=false; tick();
  clearInterval(tInt); tInt=setInterval(tick, 250);
}
function tick(){
  const left = Math.max(0, Math.ceil((tEnd-Date.now())/1000));
  $("timerTime").textContent = Math.floor(left/60)+":"+pad(left%60);
  if(left===0){ clearInterval(tInt); beep(); try{navigator.vibrate&&navigator.vibrate(300)}catch(e){} $("timerLabel").textContent="Terminé !"; setTimeout(()=>{ if(Date.now()>=tEnd) $("timer").hidden=true }, 2500) }
}
$("timerStop").onclick = ()=>{ clearInterval(tInt); $("timer").hidden=true };
$("timerAdd").onclick = ()=>{ tEnd += 15000; clearInterval(tInt); tInt=setInterval(tick,250); tick() };

/* ---------- Rendu ---------- */
function el(tag, attrs={}, ...kids){ const n=document.createElement(tag);
  for(const k in attrs){ const v=attrs[k]; if(v===undefined||v===null||v===false) continue;
    if(k==="class") n.className=v; else if(k.startsWith("on")) n[k]=v; else if(k==="value") n.value=v; else n.setAttribute(k, v===true?"":v) }
  kids.flat().forEach(c=>{ if(c===null||c===undefined||c===false) return; n.append(c.nodeType ? c : document.createTextNode(c)) }); return n }
const howList = e => e.how && e.how.length ? el("details",{}, el("summary",{}, "Comment le faire"), el("ul",{}, e.how.map(h=>el("li",{},h)))) : null;

function renderJour(){
  const v = $("v-jour"); v.replaceChildren();
  allEx().filter(readyToLevelUp).forEach(e=>{
    const next = lvlOf(e)+1, L = e.levels[next-1];
    v.append(el("div",{class:"banner"},
      el("p",{}, el("strong",{}, e.name+" : "), "tu as réussi toutes tes séries deux fois de suite. Prêt pour "+L.t+(L.n?" ("+L.n+")":"")+" ?"),
      el("div",{class:"actions"}, el("button",{class:"btn primary", onclick:()=>{ state.levels[e.id]=next; persist(); renderAll() }}, "Passer au niveau "+next))));
  });
  allEx().forEach(e=>{
    const lvl = lvlOf(e), L = e.levels[lvl-1], sets = draft[e.id], all = sets.every(Boolean);
    v.append(el("article",{class:"card"+(all?" done":"")},
      el("div",{class:"row"}, el("div",{class:"name"}, e.name), el("span",{class:"chip"+(all?" ok":"")}, all ? "Fait" : "Niveau "+lvl)),
      el("div",{class:"target"}, L.t, el("small",{}, [L.n, e.perSide].filter(Boolean).join(" · "))),
      el("div",{class:"sets"}, sets.map((on,i)=> el("button",{class:"set","aria-pressed":String(on), onclick:()=>{
        draft[e.id][i]=!draft[e.id][i]; saveDraft();
        if(draft[e.id][i] && i<sets.length-1) startTimer(e.rest, "Repos · "+e.name);
        justSaved=false; renderJour() }}, "Série "+(i+1)))),
      el("div",{class:"actions"},
        e.unit==="sec" && L.s ? el("button",{class:"btn", onclick:()=>startTimer(L.s, "Effort · "+e.name)}, "Chrono "+L.s+" s") : null,
        el("button",{class:"btn", onclick:()=>startTimer(e.rest, "Repos · "+e.name)}, "Repos "+e.rest+" s")),
      howList(e)));
  });
  const already = state.sessions.some(s=>s.date===TODAY);
  v.append(el("button",{class:"btn primary big", onclick:saveToday}, already ? "Mettre à jour la séance du jour" : "Enregistrer la séance"));
  if(justSaved) v.append(el("p",{class:"saved"}, "Séance enregistrée."));
  v.append(el("p",{class:"note"}, "Coche chaque série terminée : le minuteur de repos se lance tout seul. Garde 1 jour de repos par semaine, et un de plus si tu as des courbatures marquées ou une gêne aux poignets ou aux épaules."));
}

function saveToday(){
  const results = {};
  allEx().forEach(e=>{ if(draft[e.id].some(Boolean)) results[e.id] = {level:lvlOf(e), sets:draft[e.id].slice()} });
  if(!Object.keys(results).length){ justSaved=false; note("Coche au moins une série avant d'enregistrer."); return }
  putSession({date:TODAY, results, savedAt:new Date().toISOString()});
  justSaved=true; renderAll();
}
function note(t){ $("storeNote").textContent = t }

/* ---------- Programme + exercices perso ---------- */
function blankExForm(){ return {id:null, name:"", unit:"reps", sets:3, l1:"", l2:"", l3:"", rest:60, side:"", how:"", err:""} }
function exFormFrom(c){ return {id:c.id, name:c.name, unit:c.unit, sets:c.sets, l1:c.targets[0]??"", l2:c.targets[1]??"", l3:c.targets[2]??"", rest:c.rest, side:c.perSide||"", how:(c.how||[]).join("\n"), err:""} }

function field(label, input){ return el("label",{class:"field"}, el("span",{}, label), input) }
function bind(key, attrs){ return el("input", Object.assign({value:exForm[key], oninput:ev=>{ exForm[key]=ev.target.value }}, attrs)) }

function renderExForm(){
  const f = exForm;
  const unitSel = el("select",{id:"cxUnit", onchange:ev=>{ f.unit=ev.target.value; renderProg() }},
    el("option",{value:"reps"},"Répétitions"), el("option",{value:"sec"},"Secondes (exercice tenu)"));
  unitSel.value = f.unit;
  const u = f.unit==="sec" ? "secondes" : "répétitions";
  return el("article",{class:"card form"},
    el("div",{class:"name"}, f.id ? "Modifier l'exercice" : "Nouvel exercice"),
    field("Nom", bind("name",{id:"cxName", type:"text", placeholder:"Ex. : Fentes alternées", maxlength:"40"})),
    el("div",{class:"grid2"},
      field("Type", unitSel),
      field("Séries", bind("sets",{id:"cxSets", type:"number", min:"1", max:"10", inputmode:"numeric"}))),
    el("div",{class:"grid3"},
      field("Niveau 1 ("+u+")", bind("l1",{id:"cxL1", type:"number", min:"1", inputmode:"numeric", placeholder:"10"})),
      field("Niveau 2", bind("l2",{id:"cxL2", type:"number", min:"1", inputmode:"numeric", placeholder:"15"})),
      field("Niveau 3", bind("l3",{id:"cxL3", type:"number", min:"1", inputmode:"numeric", placeholder:"20"}))),
    el("div",{class:"grid2"},
      field("Repos entre séries (s)", bind("rest",{id:"cxRest", type:"number", min:"0", inputmode:"numeric"})),
      field("Précision (facultatif)", bind("side",{id:"cxSide", type:"text", placeholder:"par jambe, par côté…", maxlength:"30"}))),
    field("Consignes (facultatif, une par ligne)", el("textarea",{id:"cxHow", rows:"3", value:f.how, oninput:ev=>{ f.how=ev.target.value }})),
    f.err ? el("p",{class:"err"}, f.err) : null,
    el("div",{class:"actions"},
      el("button",{class:"btn primary", onclick:saveExForm}, f.id ? "Enregistrer les modifications" : "Ajouter au programme"),
      el("button",{class:"btn", onclick:()=>{ exForm=null; renderProg() }}, "Annuler")));
}

function saveExForm(){
  const f = exForm;
  const name = String(f.name).trim(), sets = parseInt(f.sets,10), rest = parseInt(f.rest,10);
  const targets = [f.l1,f.l2,f.l3].map(x=>parseInt(x,10)).filter(n=>n>0);
  if(!name){ f.err="Donne un nom à l'exercice."; return renderProg() }
  if(!(sets>=1 && sets<=10)){ f.err="Indique un nombre de séries entre 1 et 10."; return renderProg() }
  if(!targets.length){ f.err="Indique au moins l'objectif du niveau 1."; return renderProg() }
  const c = {id: f.id || "c-"+Date.now().toString(36), name, unit:f.unit, sets, rest: rest>=0?rest:60,
    perSide:String(f.side).trim(), targets, how:String(f.how).split("\n").map(s=>s.trim()).filter(Boolean)};
  if(f.id) state.custom = state.custom.map(x=>x.id===f.id?c:x); else { state.custom.push(c); state.levels[c.id]=1 }
  persist(); exForm=null; loadDraft(); note("« "+name+" » "+(f.id?"modifié.":"ajouté à ton programme.")); renderAll();
}

function renderProg(){
  const v = $("v-prog"); v.replaceChildren();
  v.append(el("p",{class:"note"}, "Passe au niveau suivant quand tu réussis toutes les séries proprement deux séances de suite. Touche un niveau pour le choisir toi-même."));
  if(exForm) v.append(renderExForm());
  else v.append(el("button",{class:"btn primary big", onclick:()=>{ exForm=blankExForm(); renderProg(); setTimeout(()=>$("cxName")&&$("cxName").focus(),0) }}, "+ Ajouter un exercice"));
  allEx().forEach(e=>{
    const lvl = lvlOf(e);
    const card = el("article",{class:"card"},
      el("div",{class:"row"}, el("div",{class:"name"}, e.name), el("span",{class:"chip"}, (e.custom?"Perso · ":"")+"Repos "+e.rest+" s")),
      el("div",{class:"levelpick"}, e.levels.map((L,i)=> el("button",{"aria-pressed":String(lvl===i+1), onclick:()=>{ state.levels[e.id]=i+1; persist(); renderAll() }},
        "Niv. "+(i+1)+" · "+L.t+(L.n==="sur les genoux"?" (genoux)":"")))),
      howList(e));
    if(e.custom){
      const c = state.custom.find(x=>x.id===e.id);
      card.append(exDelConfirm===e.id
        ? el("div",{class:"confirm"}, el("p",{}, "Supprimer « "+e.name+" » du programme ? Les séances passées gardent leurs résultats."),
            el("div",{class:"actions"},
              el("button",{class:"btn danger", onclick:()=>{ state.custom=state.custom.filter(x=>x.id!==e.id); delete state.levels[e.id]; exDelConfirm=null; persist(); note("Exercice supprimé."); renderAll() }}, "Oui, supprimer"),
              el("button",{class:"btn", onclick:()=>{ exDelConfirm=null; renderProg() }}, "Annuler")))
        : el("div",{class:"actions"},
            el("button",{class:"btn", onclick:()=>{ exForm=exFormFrom(c); renderProg(); window.scrollTo({top:0, behavior:"smooth"}) }}, "Modifier"),
            el("button",{class:"btn", onclick:()=>{ exDelConfirm=e.id; renderProg() }}, "Supprimer")));
    }
    v.append(card);
  });
}

/* ---------- Historique + séances manuelles ---------- */
function openEditor(date){
  const s = state.sessions.find(x=>x.date===date);
  const results = {};
  allEx().forEach(e=>{
    const r = s && s.results[e.id];
    results[e.id] = r ? {level:Math.min(r.level, e.levels.length), sets: r.sets.length===e.sets ? r.sets.slice() : emptySets(e).map((_,i)=>!!r.sets[i])}
                      : {level:lvlOf(e), sets:emptySets(e)};
  });
  editing = {date, results, exists:!!s};
  delConfirm = false;
}

function renderEditor(){
  const ed = editing;
  const dateIn = el("input",{id:"edDate", type:"date", max:TODAY, value:ed.date, onchange:ev=>{
    const d = ev.target.value; if(!d) return; if(d>TODAY){ ev.target.value=ed.date; return }
    openEditor(d); renderHist() }});
  const rows = allEx().map(e=>{
    const r = ed.results[e.id];
    const sel = el("select",{"aria-label":"Niveau "+e.name, onchange:ev=>{ r.level=parseInt(ev.target.value,10); renderHist() }},
      e.levels.map((L,i)=> el("option",{value:String(i+1)}, "Niv. "+(i+1)+" · "+L.t+(L.n==="sur les genoux"?" (genoux)":""))));
    sel.value = String(r.level);
    return el("div",{class:"edrow"},
      el("div",{class:"row"}, el("strong",{}, e.name), sel),
      el("div",{class:"sets"}, r.sets.map((on,i)=> el("button",{class:"set small","aria-pressed":String(on), onclick:()=>{ r.sets[i]=!r.sets[i]; renderHist() }}, "S"+(i+1)))));
  });
  return el("article",{class:"card form"},
    el("div",{class:"name"}, ed.exists ? "Modifier une séance" : "Ajouter une séance"),
    field("Date", dateIn),
    ed.exists ? el("p",{class:"note"}, "Une séance existe déjà le "+fmtLong(ed.date)+" : tu la modifies.") : null,
    el("p",{class:"note"}, "Pour chaque exercice, choisis le niveau et touche les séries réussies."),
    rows,
    el("div",{class:"actions"},
      el("button",{class:"btn primary", onclick:saveEditor}, "Enregistrer"),
      el("button",{class:"btn", onclick:()=>{ editing=null; renderHist() }}, "Annuler"),
      ed.exists && !delConfirm ? el("button",{class:"btn danger-outline", onclick:()=>{ delConfirm=true; renderHist() }}, "Supprimer la séance") : null),
    delConfirm ? el("div",{class:"confirm"}, el("p",{}, "Supprimer définitivement la séance du "+fmtLong(ed.date)+" ?"),
      el("div",{class:"actions"},
        el("button",{class:"btn danger", onclick:()=>{ removeSession(ed.date); editing=null; note("Séance supprimée."); renderAll() }}, "Oui, supprimer"),
        el("button",{class:"btn", onclick:()=>{ delConfirm=false; renderHist() }}, "Annuler"))) : null);
}

function saveEditor(){
  const ed = editing, results = {};
  for(const id in ed.results){ const r = ed.results[id]; if(r.sets.some(Boolean)) results[id] = {level:r.level, sets:r.sets.slice()} }
  if(!Object.keys(results).length){ note("Touche au moins une série réussie avant d'enregistrer."); return }
  putSession({date:ed.date, results, savedAt:new Date().toISOString(), manual:true});
  note("Séance du "+fmtLong(ed.date)+" enregistrée."); editing=null; renderAll();
}

function backupCard(){
  return el("article",{class:"card"},
    el("div",{class:"name"},"Sauvegarde"),
    el("p",{class:"note"},"Enregistre un fichier avec tes niveaux, tes exercices et tes séances, pour ne rien perdre si tu changes de téléphone ou effaces les données du navigateur."),
    el("div",{class:"actions"},
      el("button",{class:"btn primary", onclick:exportData},"Exporter mes données"),
      el("button",{class:"btn", onclick:()=>$("importFile").click()},"Importer une sauvegarde")));
}
function exportData(){
  const blob = new Blob([JSON.stringify({app:"mon-renfo",version:2,levels:state.levels,sessions:state.sessions,custom:state.custom},null,1)],{type:"application/json"});
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "mon-renfo-"+TODAY+".json";
  document.body.append(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
}
function importData(file){
  const r = new FileReader();
  r.onload = () => { try{
    const d = JSON.parse(r.result); if(d.app!=="mon-renfo") throw 0;
    state.levels = Object.assign({}, d.levels||{}); state.sessions = d.sessions||[]; state.custom = d.custom||[];
    persist(); ls("renfo-draft", null); loadDraft(); renderAll();
    note("Sauvegarde importée : "+state.sessions.length+" séance(s), "+state.custom.length+" exercice(s) perso.");
  }catch(e){ note("Ce fichier n'est pas une sauvegarde Mon Renfo.") } };
  r.readAsText(file);
}

function renderHist(){
  const v = $("v-hist"); v.replaceChildren();
  if(editing) v.append(renderEditor());
  else v.append(el("button",{class:"btn primary big", onclick:()=>{
    const y = new Date(); y.setDate(y.getDate()-1); openEditor(dayKey(y)); renderHist() }}, "+ Ajouter une séance passée"));
  const ss = sortedSessions();
  if(!ss.length){
    v.append(el("div",{class:"card"}, el("p",{class:"note"}, "Aucune séance enregistrée pour l'instant. Termine ta séance dans l'onglet Aujourd'hui, ou ajoute une séance passée.")));
  } else {
    const exs = allEx();
    const extra = new Set(); ss.forEach(s=>Object.keys(s.results).forEach(id=>{ if(!exById(id)) extra.add(id) }));
    const cols = exs.map(e=>({id:e.id, label:e.name.split(" ")[0]})).concat([...extra].map(id=>({id, label:"(supprimé)"})));
    const tbl = el("table",{}, el("thead",{}, el("tr",{}, el("th",{},"Date"), cols.map(c=>el("th",{}, c.label)))),
      el("tbody",{}, ss.slice(0,90).map(s=> el("tr",{class:"click", tabindex:"0", title:"Modifier cette séance",
          onclick:()=>{ openEditor(s.date); renderHist(); window.scrollTo({top:0, behavior:"smooth"}) },
          onkeydown:ev=>{ if(ev.key==="Enter"){ openEditor(s.date); renderHist() } }},
        el("td",{}, fmtDate(s.date)), cols.map(c=>{
          const r = s.results[c.id]; if(!r) return el("td",{},"–");
          return el("td",{}, el("div",{class:"dots", title:"Niveau "+r.level}, r.sets.map(o=>el("span",{class:"dot"+(o?" on":"")}))), el("small",{class:"lv"}, "N"+r.level)) })))));
    v.append(el("div",{class:"card"}, el("div",{class:"scroll"}, tbl)));
    v.append(el("p",{class:"note"}, "Chaque point vert est une série réussie. N indique le niveau. Touche une ligne pour modifier ou supprimer la séance."));
  }
  v.append(backupCard());
}

function renderAll(){
  $("stStreak").textContent = streak(); $("stWeek").textContent = thisWeek(); $("stTotal").textContent = state.sessions.length;
  renderJour(); renderProg(); renderHist();
}

document.querySelectorAll("nav button").forEach(b=> b.onclick = ()=>{
  document.querySelectorAll("nav button").forEach(x=>x.setAttribute("aria-selected", String(x===b)));
  ["jour","prog","hist"].forEach(t=> $("v-"+t).hidden = t!==b.dataset.tab);
  try{ sessionStorage.setItem("renfo-tab", b.dataset.tab) }catch(e){}
});
$("today").textContent = new Date().toLocaleDateString("fr-FR",{weekday:"long", day:"numeric", month:"long"});
$("importFile").onchange = e => { if(e.target.files[0]) importData(e.target.files[0]); e.target.value="" };

loadState(); loadDraft(); renderAll();
note("Tes séances sont enregistrées sur ce téléphone. Pense à faire une sauvegarde de temps en temps (onglet Historique).");
if("serviceWorker" in navigator){ window.addEventListener("load", ()=> navigator.serviceWorker.register("sw.js").catch(()=>{})) }
</script>
