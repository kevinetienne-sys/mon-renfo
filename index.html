<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mon Renfo</title>
<meta name="theme-color" content="#1A5FD6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Mon Renfo">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Carnet d'entraînement : une colonne mobile, cartes d'exercice avec 3 cases de série, minuteur en bas d'écran */
:root{
  --bg:#EEF2F5; --surface:#FFFFFF; --ink:#13202B; --muted:#5B6B78; --line:#D5DDE4;
  --accent:#1A5FD6; --accent-soft:#DCE7FB; --ok:#1E8A5A; --ok-soft:#DDF2E7; --warn:#B76A00;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E151C; --surface:#17212B; --ink:#E6EDF3; --muted:#93A3B1; --line:#2A3743;
  --accent:#6C9BFF; --accent-soft:#1D2D4A; --ok:#4CC58C; --ok-soft:#173326; --warn:#E3A24A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E151C; --surface:#17212B; --ink:#E6EDF3; --muted:#93A3B1; --line:#2A3743;
  --accent:#6C9BFF; --accent-soft:#1D2D4A; --ok:#4CC58C; --ok-soft:#173326; --warn:#E3A24A; color-scheme:dark}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--body);font-size:16px;line-height:1.45}
.wrap{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:calc(18px + env(safe-area-inset-top,0px)) 120px;display:flex;flex-direction:column;gap:18px}
header{display:flex;flex-direction:column;gap:12px}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
h1{font-family:var(--display);font-weight:800;font-size:2.4rem;line-height:1;margin:0;letter-spacing:.01em;text-transform:uppercase}
.date{color:var(--muted);font-size:.95rem}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column}
.stat b{font-family:var(--display);font-size:1.7rem;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.stat span{font-size:.78rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
nav{display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:4px;gap:4px}
nav button{font:600 .95rem var(--body);background:none;border:0;color:var(--muted);padding:9px 4px;border-radius:7px;cursor:pointer}
nav button[aria-selected="true"]{background:var(--accent);color:#fff}
button:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.list{display:flex;flex-direction:column;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px}
.card.done{border-color:var(--ok)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.name{font-family:var(--display);font-weight:700;font-size:1.45rem;line-height:1.1;text-transform:uppercase;letter-spacing:.02em}
.chip{font-size:.78rem;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.target{font-family:var(--display);font-size:2rem;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.target small{font-family:var(--body);font-size:.9rem;font-weight:500;color:var(--muted);margin-left:6px}
.sets{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.set{font:600 .95rem var(--body);border:1.5px solid var(--line);background:var(--bg);color:var(--ink);border-radius:9px;padding:11px 4px;cursor:pointer}
.set[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:#fff}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{font:600 .9rem var(--body);border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:8px 12px;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.big{width:100%;padding:14px;font-size:1.05rem}
details{border-top:1px solid var(--line);padding-top:8px}
summary{cursor:pointer;color:var(--accent);font-weight:600;font-size:.92rem}
details ul{margin:8px 0 0;padding-left:18px;color:var(--ink);font-size:.93rem;display:flex;flex-direction:column;gap:4px}
.banner{background:var(--ok-soft);border:1px solid var(--ok);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.banner p{margin:0}
.note{color:var(--muted);font-size:.88rem;margin:0}
table{width:100%;border-collapse:collapse;font-size:.92rem;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--line)}
th{font-size:.75rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600}
td.cur{background:var(--accent-soft);color:var(--accent);font-weight:600;border-radius:6px}
.scroll{overflow-x:auto}
.levelpick{display:flex;gap:6px;flex-wrap:wrap}
.levelpick button{font:600 .85rem var(--body);border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:7px;padding:6px 10px;cursor:pointer}
.levelpick button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.hist{display:flex;flex-direction:column;gap:6px}
.hist .row{font-size:.92rem}
.dots{display:flex;gap:4px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--line)}
.dot.on{background:var(--ok)}
.timer{position:fixed;left:0;right:0;bottom:0;background:var(--ink);color:var(--bg);padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;justify-content:space-between;gap:12px;z-index:5}
.timer .t{font-family:var(--display);font-size:2.6rem;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.timer .l{font-size:.85rem;opacity:.8}
.timer .btn{background:transparent;color:var(--bg);border-color:currentColor}
.saved{color:var(--ok);font-weight:600;text-align:center;margin:0}
@media (prefers-reduced-motion:no-preference){.set,nav button{transition:background .15s,color .15s}}
</style>
<style>[hidden]{display:none!important}*{box-sizing:border-box}body{margin:0;-webkit-tap-highlight-color:transparent}</style>
</head>
<body>


<div class="wrap">
  <header>
    <div class="top">
      <h1>Mon Renfo</h1>
      <div class="date" id="today"></div>
    </div>
    <div class="stats">
      <div class="stat"><b id="stStreak">0</b><span>Jours d'affilée</span></div>
      <div class="stat"><b id="stWeek">0</b><span>Cette semaine</span></div>
      <div class="stat"><b id="stTotal">0</b><span>Séances</span></div>
    </div>
    <nav role="tablist">
      <button role="tab" id="tab-jour" aria-selected="true" data-tab="jour">Aujourd'hui</button>
      <button role="tab" id="tab-prog" aria-selected="false" data-tab="prog">Programme</button>
      <button role="tab" id="tab-hist" aria-selected="false" data-tab="hist">Historique</button>
    </nav>
  </header>

  <section id="v-jour" class="list"></section>
  <section id="v-prog" class="list" hidden></section>
  <section id="v-hist" class="list" hidden></section>
  <p class="note" id="storeNote"></p>
  <input type="file" id="importFile" accept="application/json,.json" hidden>
</div>

<div class="timer" id="timer" hidden>
  <div><div class="l" id="timerLabel">Repos</div><div class="t" id="timerTime">0:60</div></div>
  <div class="actions"><button class="btn" id="timerAdd">+15 s</button><button class="btn" id="timerStop">Arrêter</button></div>
</div>

<script>
const EX = [
  {id:"pompes", name:"Pompes", unit:"reps", rest:60, levels:[
    {t:"3 × 8", n:"sur les genoux"},{t:"3 × 12", n:"sur les genoux"},{t:"3 × 20", n:"sur les genoux"},
    {t:"3 × 8", n:"classiques"},{t:"3 × 12", n:"classiques"},{t:"3 × 20", n:"classiques"}],
   how:["Mains un peu plus larges que les épaules, corps gainé de la tête aux genoux (ou aux pieds).","Descends la poitrine près du sol en gardant les coudes à environ 45° du corps.","Souffle en poussant. Ne laisse pas le bassin s'affaisser."]},
  {id:"squats", name:"Squats", unit:"reps", rest:60, levels:[{t:"3 × 15"},{t:"3 × 25"},{t:"3 × 35"}],
   how:["Pieds largeur d'épaules, pointes légèrement ouvertes.","Envoie les fesses en arrière, dos droit, genoux dans l'axe des pieds.","Descends jusqu'à cuisses parallèles au sol, remonte en soufflant."]},
  {id:"superman", name:"Superman", unit:"reps", rest:45, levels:[{t:"3 × 8"},{t:"3 × 12"},{t:"3 × 15"}],
   how:["À plat ventre, bras tendus devant, jambes tendues, regard vers le sol.","Décolle bras, poitrine et jambes de 5 à 10 cm seulement, en même temps.","Tiens 2 s en t'allongeant, redescends en 2 s. Souffle en montant.","Trop dur : bras droit + jambe gauche, puis l'inverse. Douleur vive au dos : stop."]},
  {id:"curl", name:"Curl isométrique", unit:"sec", rest:45, perSide:"par bras", levels:[{t:"3 × 15 s",s:15},{t:"3 × 25 s",s:25},{t:"3 × 40 s",s:40}],
   how:["Bras plié à 90°, paume vers le haut, coude collé au corps.","L'autre main sur le poignet : le bras pousse vers le haut, la main résiste. Rien ne bouge.","Pousse à 70-80 % de ta force en respirant normalement, puis change de bras.","Bras droit puis gauche = 1 série."]},
  {id:"planche", name:"Planche", unit:"sec", rest:40, levels:[{t:"3 × 20 s",s:20},{t:"3 × 40 s",s:40},{t:"3 × 60 s",s:60}],
   how:["Sur les avant-bras, coudes sous les épaules.","Corps aligné, ventre et fessiers serrés, bassin ni trop haut ni trop bas.","Respire calmement, ne bloque pas ta respiration."]},
  {id:"lateral", name:"Gainage latéral", unit:"sec", rest:40, perSide:"par côté", levels:[{t:"3 × 15 s",s:15},{t:"3 × 30 s",s:30},{t:"3 × 45 s",s:45}],
   how:["Sur un avant-bras, coude sous l'épaule, pieds empilés (ou genoux au sol pour faciliter).","Hanches hautes, corps en ligne droite.","Côté droit puis côté gauche = 1 série."]}
];

const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2,"0");
const dayKey = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const TODAY = dayKey(new Date());

let state = { levels:{}, sessions:[] };
EX.forEach(e => state.levels[e.id] = 1);
let draft = {};          // {exId:[bool,bool,bool]}
let store = null;        // {saveLevels, saveSession}
let justSaved = false;

function ls(k, v){ try{ if(v===undefined){ const r=localStorage.getItem(k); return r?JSON.parse(r):null } localStorage.setItem(k, JSON.stringify(v)) }catch(e){ return null } }

function loadDraft(){
  const d = ls("renfo-draft");
  draft = (d && d.day===TODAY) ? d.sets : {};
  const todaySess = state.sessions.find(s => s.date===TODAY);
  if(!d || d.day!==TODAY){ if(todaySess){ EX.forEach(e=>{ if(todaySess.results[e.id]) draft[e.id]=todaySess.results[e.id].sets.slice() }) } }
  EX.forEach(e => { if(!draft[e.id]) draft[e.id]=[false,false,false] });
}
function saveDraft(){ ls("renfo-draft", {day:TODAY, sets:draft}) }

/* ---------- Stockage ---------- */
async function initStore(){
  const lv = ls("renfo-levels"); if(lv) Object.assign(state.levels, lv);
  state.sessions = ls("renfo-sessions") || [];
  store = {
    async saveLevels(){ ls("renfo-levels", state.levels) },
    async saveSession(s){ state.sessions = state.sessions.filter(x=>x.date!==s.date).concat(s); ls("renfo-sessions", state.sessions) }
  };
  $("storeNote").textContent = "Tes séances sont enregistrées sur ce téléphone. Pense à faire une sauvegarde de temps en temps (onglet Historique).";
}

/* ---------- Calculs ---------- */
function sortedSessions(){ return state.sessions.slice().sort((a,b)=> a.date<b.date?1:-1) }
function streak(){
  const days = new Set(state.sessions.map(s=>s.date));
  const d = new Date(); if(!days.has(dayKey(d))) d.setDate(d.getDate()-1);
  let n=0; while(days.has(dayKey(d))){ n++; d.setDate(d.getDate()-1) }
  return n;
}
function thisWeek(){
  const d = new Date(); const dow = (d.getDay()+6)%7; d.setDate(d.getDate()-dow);
  const start = dayKey(d); return state.sessions.filter(s=>s.date>=start).length;
}
function readyToLevelUp(e){
  const lvl = state.levels[e.id]; if(lvl >= e.levels.length) return false;
  const last = sortedSessions().filter(s=>s.results && s.results[e.id]).slice(0,2);
  return last.length===2 && last.every(s => s.results[e.id].level===lvl && s.results[e.id].sets.every(Boolean));
}

/* ---------- Minuteur ---------- */
let tEnd=0, tInt=null, actx=null;
function beep(){ try{ actx = actx || new (window.AudioContext||window.webkitAudioContext)();
  [0,0.25,0.5].forEach(o=>{ const os=actx.createOscillator(), g=actx.createGain(); os.frequency.value=880; os.connect(g); g.connect(actx.destination);
    g.gain.setValueAtTime(0.2, actx.currentTime+o); g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime+o+0.2); os.start(actx.currentTime+o); os.stop(actx.currentTime+o+0.2) }) }catch(e){} }
function startTimer(sec, label){
  try{ actx = actx || new (window.AudioContext||window.webkitAudioContext)(); actx.resume && actx.resume() }catch(e){}
  tEnd = Date.now()+sec*1000; $("timerLabel").textContent=label; $("timer").hidden=false; tick();
  clearInterval(tInt); tInt=setInterval(tick, 250);
}
function tick(){
  const left = Math.max(0, Math.ceil((tEnd-Date.now())/1000));
  $("timerTime").textContent = Math.floor(left/60)+":"+pad(left%60);
  if(left===0){ clearInterval(tInt); beep(); try{navigator.vibrate&&navigator.vibrate(300)}catch(e){} $("timerLabel").textContent="Terminé !"; setTimeout(()=>{ if(Date.now()>=tEnd) $("timer").hidden=true }, 2500) }
}
$("timerStop").onclick = ()=>{ clearInterval(tInt); $("timer").hidden=true };
$("timerAdd").onclick = ()=>{ tEnd += 15000; clearInterval(tInt); tInt=setInterval(tick,250); tick() };

/* ---------- Rendu ---------- */
function el(tag, attrs={}, ...kids){ const n=document.createElement(tag);
  for(const k in attrs){ if(k==="class") n.className=attrs[k]; else if(k.startsWith("on")) n[k]=attrs[k]; else n.setAttribute(k, attrs[k]) }
  kids.flat().forEach(c=> n.append(c && c.nodeType ? c : document.createTextNode(c ?? ""))); return n }

function renderJour(){
  const v = $("v-jour"); v.replaceChildren();
  const ups = EX.filter(readyToLevelUp);
  ups.forEach(e=>{
    const next = state.levels[e.id]+1, L = e.levels[next-1];
    v.append(el("div",{class:"banner"},
      el("p",{}, el("strong",{}, e.name+" : "), "tu as réussi tes 3 séries deux fois de suite. Prêt pour "+L.t+(L.n?" ("+L.n+")":"")+" ?"),
      el("div",{class:"actions"}, el("button",{class:"btn primary", onclick:async()=>{ state.levels[e.id]=next; await store.saveLevels(); renderAll() }}, "Passer au niveau "+next))));
  });
  EX.forEach(e=>{
    const lvl = state.levels[e.id], L = e.levels[lvl-1], sets = draft[e.id], all = sets.every(Boolean);
    const card = el("article",{class:"card"+(all?" done":"")},
      el("div",{class:"row"}, el("div",{class:"name"}, e.name), el("span",{class:"chip"+(all?" ok":"")}, all ? "Fait" : "Niveau "+lvl)),
      el("div",{class:"target"}, L.t, el("small",{}, [L.n, e.perSide].filter(Boolean).join(" · "))),
      el("div",{class:"sets"}, sets.map((on,i)=> el("button",{class:"set","aria-pressed":String(on), onclick:()=>{
        draft[e.id][i]=!draft[e.id][i]; saveDraft();
        if(draft[e.id][i] && i<2) startTimer(e.rest, "Repos · "+e.name);
        justSaved=false; renderJour() }}, "Série "+(i+1)))),
      el("div",{class:"actions"},
        e.unit==="sec" ? el("button",{class:"btn", onclick:()=>startTimer(L.s, "Effort · "+e.name)}, "Chrono "+L.s+" s") : null,
        el("button",{class:"btn", onclick:()=>startTimer(e.rest, "Repos · "+e.name)}, "Repos "+e.rest+" s")),
      el("details",{}, el("summary",{}, "Comment le faire"), el("ul",{}, e.how.map(h=>el("li",{},h)))));
    v.append(card);
  });
  const already = state.sessions.some(s=>s.date===TODAY);
  v.append(el("button",{class:"btn primary big", onclick:saveSession}, already ? "Mettre à jour la séance du jour" : "Enregistrer la séance"));
  if(justSaved) v.append(el("p",{class:"saved"}, "Séance enregistrée."));
  v.append(el("p",{class:"note"}, "Coche chaque série terminée : le minuteur de repos se lance tout seul. Garde 1 jour de repos par semaine, et un de plus si tu as des courbatures marquées ou une gêne aux poignets ou aux épaules."));
}

async function saveSession(){
  const results = {};
  EX.forEach(e=>{ if(draft[e.id].some(Boolean)) results[e.id] = {level:state.levels[e.id], sets:draft[e.id].slice()} });
  if(!Object.keys(results).length){ justSaved=false; $("storeNote").textContent="Coche au moins une série avant d'enregistrer."; return }
  const s = {date:TODAY, results, savedAt:new Date().toISOString()};
  try{ await store.saveSession(s); if(!state.sessions.some(x=>x.date===TODAY)) state.sessions.push(s); else state.sessions = state.sessions.map(x=>x.date===TODAY?s:x); justSaved=true }
  catch(e){ $("storeNote").textContent="L'enregistrement a échoué. Vérifie ta connexion et réessaie." }
  renderAll();
}

function renderProg(){
  const v = $("v-prog"); v.replaceChildren();
  v.append(el("p",{class:"note"}, "3 séries par exercice. Passe au niveau suivant quand tu réussis les 3 séries proprement deux séances de suite. Touche un niveau pour le choisir toi-même."));
  EX.forEach(e=>{
    const lvl = state.levels[e.id];
    v.append(el("article",{class:"card"},
      el("div",{class:"row"}, el("div",{class:"name"}, e.name), el("span",{class:"chip"}, "Repos "+e.rest+" s")),
      el("div",{class:"levelpick"}, e.levels.map((L,i)=> el("button",{"aria-pressed":String(lvl===i+1), onclick:async()=>{ state.levels[e.id]=i+1; await store.saveLevels(); renderAll() }},
        "Niv. "+(i+1)+" · "+L.t+(L.n?" "+(L.n==="sur les genoux"?"(genoux)":""):"")))),
      el("details",{}, el("summary",{}, "Comment le faire"), el("ul",{}, e.how.map(h=>el("li",{},h))))));
  });
}

function backupCard(){
  return el("article",{class:"card"},
    el("div",{class:"name"},"Sauvegarde"),
    el("p",{class:"note"},"Enregistre un fichier avec tes niveaux et tes séances, pour ne rien perdre si tu changes de téléphone ou effaces les données du navigateur."),
    el("div",{class:"actions"},
      el("button",{class:"btn primary", onclick:exportData},"Exporter mes données"),
      el("button",{class:"btn", onclick:()=>$("importFile").click()},"Importer une sauvegarde")));
}
function exportData(){
  const blob = new Blob([JSON.stringify({app:"mon-renfo",version:1,levels:state.levels,sessions:state.sessions},null,1)],{type:"application/json"});
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "mon-renfo-"+TODAY+".json";
  document.body.append(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
}
function importData(file){
  const r = new FileReader();
  r.onload = () => { try{
    const d = JSON.parse(r.result); if(d.app!=="mon-renfo") throw 0;
    Object.assign(state.levels, d.levels||{}); state.sessions = d.sessions||[];
    ls("renfo-levels", state.levels); ls("renfo-sessions", state.sessions); loadDraft(); renderAll();
    $("storeNote").textContent = "Sauvegarde importée : "+state.sessions.length+" séance(s).";
  }catch(e){ $("storeNote").textContent = "Ce fichier n'est pas une sauvegarde Mon Renfo." } };
  r.readAsText(file);
}

function renderHist(){
  const v = $("v-hist"); v.replaceChildren();
  const ss = sortedSessions();
  v.append(backupCard());
  if(!ss.length){ v.append(el("div",{class:"card"}, el("p",{class:"note"}, "Aucune séance enregistrée pour l'instant. Termine ta première séance dans l'onglet Aujourd'hui, puis touche « Enregistrer la séance »."))); return }
  const fmt = d => new Date(d+"T12:00:00").toLocaleDateString("fr-FR",{weekday:"short", day:"numeric", month:"short"});
  const tbl = el("table",{}, el("thead",{}, el("tr",{}, el("th",{},"Date"), EX.map(e=>el("th",{}, e.name.split(" ")[0])))),
    el("tbody",{}, ss.slice(0,60).map(s=> el("tr",{}, el("td",{}, fmt(s.date)), EX.map(e=>{
      const r = s.results[e.id]; if(!r) return el("td",{},"–");
      return el("td",{}, el("div",{class:"dots", title:"Niveau "+r.level}, r.sets.map(o=>el("span",{class:"dot"+(o?" on":"")}))), el("small",{style:"color:var(--muted)"}, "N"+r.level)) })))));
  v.append(el("div",{class:"card"}, el("div",{class:"scroll"}, tbl)));
  v.append(el("p",{class:"note"}, "Chaque point vert est une série réussie. N indique le niveau du jour."));
}

function renderAll(){
  $("stStreak").textContent = streak(); $("stWeek").textContent = thisWeek(); $("stTotal").textContent = state.sessions.length;
  renderJour(); renderProg(); renderHist();
}

document.querySelectorAll("nav button").forEach(b=> b.onclick = ()=>{
  document.querySelectorAll("nav button").forEach(x=>x.setAttribute("aria-selected", String(x===b)));
  ["jour","prog","hist"].forEach(t=> $("v-"+t).hidden = t!==b.dataset.tab);
});
$("today").textContent = new Date().toLocaleDateString("fr-FR",{weekday:"long", day:"numeric", month:"long"});

$("importFile").onchange = e => { if(e.target.files[0]) importData(e.target.files[0]); e.target.value="" };
initStore().then(()=>{ loadDraft(); renderAll() });
if("serviceWorker" in navigator){ window.addEventListener("load", ()=> navigator.serviceWorker.register("sw.js").catch(()=>{})) }
</script>

</body>
</html>
